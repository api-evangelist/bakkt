      description: Withdrawing coins from an investor's crypto account may impose fees. Clients should request a fee estimate
        detailing those fees and present it to investors for confirmation prior to completing a withdrawal. Clients must then
        use the ID of the fee estimate to submit a withdrawal. The terms of the fee estimate are based on the underlying crypto
        networks' market conditions and the system honors them up to a certain grace period after generating them. After the
        grace period, clients must request a new fee estimate to conduct the withdrawal. Requests for estimates have no associated
