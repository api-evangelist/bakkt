  /apex-crypto/api/v2/orders:
    post:
      description: 'Client systems use this endpoint to submit new order instructions to buy or sell crypto on behalf of an
        investor. <br/><br/>The order processes asynchronously. The system allows duplicate submissions; however, order details
        must NOT change in subsequent requests. Orders are uniquely tracked for idempotency by the submitting system providing
        the `clientOrderId` field. <br/><br/> Clients can provide the amounts to purchase or sell crypto in two different
        ways: <br/> <br/>`Notional` - Using the notional field, an investor may place an order for crypto given a USD amount
        to purchase. For example, an investor can buy $100 of BTCUSD at market price by entering 100 in the notional field.
        <br/>`Absolute` - Using the quantity field, an investor may place an order for an exact amount of crypto. For example,
        an investor can sell 0.05 BTC for USD by entering 0.05 in the quantity field.

        '
      operationId: submitOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderRequest'
        description: Submits a new order to fill given the terms provided by the investor
        required: true
      responses:
        '200':
          description: This response returns when the order already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '201':
          description: This response returns the newly created order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: This response returns when the request to submit the order was submitted improperly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: This response returns if the system encounters an unexpected error while handling this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: This response returns if the system encounters an unexpected error while handling this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - api_key: []
      summary: Submit an Order to Buy or Sell Crypto
      tags:
      - Orders
