    Order:
      description: An Order represents a request to buy or sell crypto. Orders can be placed with various criteria that include,
        but are not limited to, how much to purchase, how long the purchase order should stand, what price is acceptable in
        the case of limit orders, etc. Orders are sent to one or more liquidity providers for fullfillment using a best-bid,
        offer-match methodology in order to acquire the best market execution for investors' orders.
