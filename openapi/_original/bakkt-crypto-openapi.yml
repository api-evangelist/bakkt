        this service as a convenience to ask about specific withdrawals. Since Crypto systems must confirm withdrawals on
        the blockchain, the request always has a network-dependent time lag from the moment a user submits a withdrawal on
        chain until the transfer completes. While client systems may use this service to ask for the latest update for a given
        transfer, Bakkt encourages clients to rely on the transfer websockets mechanism to receive timely updates to transfers
        as they post to Bakkt systems and move through the blockchain.
      operationId: getWithdraw
