idempotency:
  supported: true
  mechanism: client-supplied idempotency key in the request body
  key_field: clientOrderId (orders), clientTransactionId (allocations/gifts/transfers)
  behavior: Duplicate submissions with the same clientOrderId are de-duplicated; order details must NOT
    change across retries. Orders are uniquely tracked for idempotency by the submitting system.
  scope: per submitting client system
  docs: https://bakkt.readme.io/reference/submitorder
async_processing:
  orders: Orders process asynchronously; acknowledgments, cancels, rejections and fills are delivered
    via the Execution Report and event/webhook mechanisms rather than synchronously.
pagination:
  style: not-documented
  notes: Endpoints are keyed by client-supplied IDs (account ID, clientOrderId, batchTransactionId); no
    cursor/offset pagination documented.
