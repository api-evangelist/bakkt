aid: bakkt
name: Bakkt
description: 'Bakkt is a digital asset platform that provides crypto trading, custody, and fiat
  funding infrastructure to financial institutions and fintech apps. Its Crypto Solutions API is a
  REST/FIX platform (with WebSocket market data and webhook/SQS events) that lets a client''s
  investors buy, sell, hold, and transfer bitcoin, ether, and other digital assets in a branded
  environment, plus a Fiat/Partner API for account opening, KYC/KYB, Plaid bank linking, and
  ACH/Wire on-ramping. Surfaced as a portfolio company of Multicoin Capital and Pantera Capital and
  enriched from Bakkt''s public developer hub (bakkt.readme.io / developer.bakkt.com).'
